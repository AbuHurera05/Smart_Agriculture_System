  <path d="M60 63 C56 61 48 61 44 65 C43 66 45 67 47 66 C51 64 56 65 60 67 C64 65 69 64 73 66 C75 67 77 66 76 65 C72 61 64 61 60 63 Z" fill="#1c1917" />

