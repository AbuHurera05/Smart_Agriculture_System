  <path d="M63 47 C66 45 71 45 74 47" stroke="#292524" stroke-width="2" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M59 52 L58 59 C58 61 62 61 62 59" stroke="#c05621" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Smile -->
