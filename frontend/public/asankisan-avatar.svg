  <ellipse cx="38.5" cy="59" rx="2.5" ry="4" fill="#dd6b20" opacity="0.4" />
  <ellipse cx="82" cy="59" rx="4.5" ry="7" fill="#f6ad55" />
  <ellipse cx="81.5" cy="59" rx="2.5" ry="4" fill="#dd6b20" opacity="0.4" />

