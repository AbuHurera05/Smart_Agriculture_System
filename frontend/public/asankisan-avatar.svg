  <path d="M30 36 C34 22 56 18 78 22 C64 26 42 28 30 36 Z" fill="url(#pagriFold1)" />
  <path d="M40 22 C62 21 86 26 90 38 C80 32 58 30 40 22 Z" fill="url(#pagriFold2)" />
  <path d="M32 42 C40 33 60 30 88 34 C89 39 86 44 82 45 C66 38 48 38 32 42 Z" fill="url(#pagriMain)" />
  <path d="M31 43 C46 36 68 36 86 43 C88 46 84 49 80 48 C66 42 48 42 34 48 C31 46 30 44 31 43 Z" fill="url(#pagriFold1)" />
  <path d="M54 36 C58 33 62 33 66 36 C64 42 56 42 54 36 Z" fill="#b45309" />
  <circle cx="60" cy="38" r="3.2" fill="#10b981" stroke="#fef08a" stroke-width="1" />
  <circle cx="59.3" cy="37.2" r="1" fill="#ffffff" />
  <path d="M38 32 C48 26 66 26 80 30" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
