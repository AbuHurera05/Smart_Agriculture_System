  <path d="M54 88 L60 102 L66 88" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="60" cy="107" r="1.8" fill="#15803d" />

  <!-- Wheat pin on Kurta -->
  <path d="M38 97 C42 94 45 95 46 99 C44 101 40 100 38 97 Z" fill="url(#goldGrad)" />
  <line x1="42" y1="96" x2="44" y2="103" stroke="#b45309" stroke-width="1" />

